services:
  eureka-server:
    build: ./eureka-server
    container_name: shopsphere-eureka-server
    environment:
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    ports:
      - "8761:8761"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    container_name: shopsphere-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"

  config-server:
    build: ./config-server
    container_name: shopsphere-config-server
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "8888:8888"

  auth-service:
    build: ./auth-service
    container_name: shopsphere-auth-service
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      OTEL_METRICS_EXPORT_ENABLED: "true"
      OTEL_TRACES_EXPORT_ENABLED: "true"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "12345"
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_CACHE_TYPE: redis
    ports:
      - "8081:8081"

  catalog-service:
    build: ./catalog-service
    container_name: shopsphere-catalog-service
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      OTEL_METRICS_EXPORT_ENABLED: "true"
      OTEL_TRACES_EXPORT_ENABLED: "true"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "12345"
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_CACHE_TYPE: redis
    ports:
      - "8082:8082"

  inventory-service:
    build: ./inventory-service
    container_name: shopsphere-inventory-service
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      OTEL_METRICS_EXPORT_ENABLED: "true"
      OTEL_TRACES_EXPORT_ENABLED: "true"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "12345"
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_CACHE_TYPE: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:29092
      SCHEMA_REGISTRY_URL: http://host.docker.internal:8084
    ports:
      - "8083:8083"

  cart-service:
    build: ./cart-service
    container_name: shopsphere-cart-service
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      OTEL_METRICS_EXPORT_ENABLED: "true"
      OTEL_TRACES_EXPORT_ENABLED: "true"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "12345"
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_CACHE_TYPE: redis
    ports:
      - "8085:8085"

  payment-service:
    build: ./payment-service
    container_name: shopsphere-payment-service
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      OTEL_METRICS_EXPORT_ENABLED: "true"
      OTEL_TRACES_EXPORT_ENABLED: "true"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "12345"
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_CACHE_TYPE: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:29092
      SCHEMA_REGISTRY_URL: http://host.docker.internal:8084
    ports:
      - "8086:8086"

  order-service:
    build: ./order-service
    container_name: shopsphere-order-service
    depends_on:
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      cart-service:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      OTEL_METRICS_EXPORT_ENABLED: "true"
      OTEL_TRACES_EXPORT_ENABLED: "true"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "12345"
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_CACHE_TYPE: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:29092
      SCHEMA_REGISTRY_URL: http://host.docker.internal:8084
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8086
      CART_SERVICE_URL: http://cart-service:8085
    ports:
      - "8087:8087"

  notifications-service:
    build: ./notifications-service
    container_name: shopsphere-notifications-service
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      OTEL_METRICS_EXPORT_ENABLED: "true"
      OTEL_TRACES_EXPORT_ENABLED: "true"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      SPRING_KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:29092
      SCHEMA_REGISTRY_URL: http://host.docker.internal:8084
    ports:
      - "8088:8088"

  api-gateway:
    build: ./api-gateway
    container_name: shopsphere-api-gateway
    depends_on:
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started
      cart-service:
        condition: service_started
      payment-service:
        condition: service_started
      order-service:
        condition: service_started
      notifications-service:
        condition: service_started
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      OTEL_METRICS_EXPORT_ENABLED: "true"
      OTEL_TRACES_EXPORT_ENABLED: "true"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      CART_SERVICE_URL: http://cart-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8086
      ORDER_SERVICE_URL: http://order-service:8087
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8088
    ports:
      - "8090:8080"
