server.port=8080
spring.application.name=api-gateway
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_FETCH:true}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}
spring.cloud.gateway.discovery.locator.enabled=false

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# Redis 7-compatible Spring Cloud Gateway token-bucket rate limiter.
# Limit: 20 requests/second, with a burst capacity of 40 per user/IP.
spring.cloud.gateway.server.webflux.default-filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.default-filters[0].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.default-filters[0].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.server.webflux.default-filters[0].args.key-resolver=#{@userOrIpKeyResolver}

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=catalog-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://catalog-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/catalog/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/catalog/(?<segment>.*), /api/catalog/${segment}

spring.cloud.gateway.server.webflux.routes[2].id=inventory-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/inventory/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/inventory/(?<segment>.*), /api/inventory/${segment}

spring.cloud.gateway.server.webflux.routes[3].id=cart-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://cart-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/cart/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/cart/(?<segment>.*), /api/cart/${segment}

spring.cloud.gateway.server.webflux.routes[4].id=order-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/orders/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/orders/(?<segment>.*), /api/orders/${segment}

spring.cloud.gateway.server.webflux.routes[5].id=payment-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/payments/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/payments/(?<segment>.*), /api/payments/${segment}

spring.cloud.gateway.server.webflux.routes[6].id=health-auth
spring.cloud.gateway.server.webflux.routes[6].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/health/auth
spring.cloud.gateway.server.webflux.routes[6].filters[0]=SetPath=/actuator/health

spring.cloud.gateway.server.webflux.routes[7].id=health-catalog
spring.cloud.gateway.server.webflux.routes[7].uri=${CATALOG_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/health/catalog
spring.cloud.gateway.server.webflux.routes[7].filters[0]=SetPath=/actuator/health

spring.cloud.gateway.server.webflux.routes[8].id=health-inventory
spring.cloud.gateway.server.webflux.routes[8].uri=${INVENTORY_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/health/inventory
spring.cloud.gateway.server.webflux.routes[8].filters[0]=SetPath=/actuator/health

spring.cloud.gateway.server.webflux.routes[9].id=health-cart
spring.cloud.gateway.server.webflux.routes[9].uri=${CART_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/health/cart
spring.cloud.gateway.server.webflux.routes[9].filters[0]=SetPath=/actuator/health

spring.cloud.gateway.server.webflux.routes[10].id=health-payment
spring.cloud.gateway.server.webflux.routes[10].uri=${PAYMENT_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/health/payment
spring.cloud.gateway.server.webflux.routes[10].filters[0]=SetPath=/actuator/health

spring.cloud.gateway.server.webflux.routes[11].id=health-order
spring.cloud.gateway.server.webflux.routes[11].uri=${ORDER_SERVICE_URL:http://localhost:8087}
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/health/order
spring.cloud.gateway.server.webflux.routes[11].filters[0]=SetPath=/actuator/health

spring.cloud.gateway.server.webflux.routes[12].id=notifications-service
spring.cloud.gateway.server.webflux.routes[12].uri=lb://notifications-service
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/notifications/**
spring.cloud.gateway.server.webflux.routes[12].filters[0]=RewritePath=/notifications/(?<segment>.*), /api/notifications/${segment}

spring.cloud.gateway.server.webflux.routes[13].id=health-notifications
spring.cloud.gateway.server.webflux.routes[13].uri=${NOTIFICATIONS_SERVICE_URL:http://localhost:8088}
spring.cloud.gateway.server.webflux.routes[13].predicates[0]=Path=/health/notifications
spring.cloud.gateway.server.webflux.routes[13].filters[0]=SetPath=/actuator/health

security.jwt.secret=this-is-a-very-long-demo-secret-key-1234567890

management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.enabled=${OTEL_METRICS_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.otlp.tracing.export.enabled=${OTEL_TRACES_EXPORT_ENABLED:false}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging.level.root=INFO
logging.level.com.example=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Kolkata} %-5level [trace:%X{traceId}] [%thread] [%class.%method:%line] - %msg%n
